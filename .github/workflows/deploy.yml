# Deploy otomatis ke GitHub Pages setiap push ke main.
# Situs ini statis (tanpa build step): hanya berkas yang dipakai game yang dipublikasikan.
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Susun berkas situs
        run: |
          mkdir _site
          cp -r index.html css js assets _site/

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
